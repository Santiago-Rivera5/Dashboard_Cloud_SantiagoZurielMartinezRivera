<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DummyJSON Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="barra-busqueda">
        <div class="titulo">
            <h1>Abarrotes el river special</h1>
        </div>

        <div class="buscador">
            <input type="text" id="buscador" placeholder="Buscar producto...">
        </div>
    </header>

    <main class="contenedor-productos" id="contenedor-productos"></main>

    <div class="modal" id="modal">
        <div class="modal-contenido">
            <span class="cerrar" id="cerrar">&times;</span>
            <div id="detalle-producto"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
